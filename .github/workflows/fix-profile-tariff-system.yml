    await q.message.edit_text(f"TARIFLAR BOSHQARUVI\\n\\nJami userlar: {len(all_registered_users())}",reply_markup=admin_tariff_list_kb()); await q.answer()

@dp.callback_query(F.data.startswith("adm_tariff_"))
async def admin_tariff_user(q:CallbackQuery):
