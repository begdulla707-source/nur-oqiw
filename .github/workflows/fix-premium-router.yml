name: Fix profile router pass-through

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch router pass-through
        shell: python
        run: |
          from pathlib import Path
          p = Path('bot/db.py')
          s = p.read_text(encoding='utf-8')
          old_import = 'from aiogram import Router, F as _F'
          new_import = 'from aiogram import Router, F as _F\nfrom aiogram.dispatcher.event.bases import SkipHandler'
          if 'from aiogram.dispatcher.event.bases import SkipHandler' not in s:
              s = s.replace(old_import, new_import, 1)
          s = s.replace('    await data["handler"](message, data)\n\n@_premium_router.message()', '    raise SkipHandler\n\n@_premium_router.message()', 1)
          s = s.replace('    await data["handler"](query, data)\n\n# Install this router', '    raise SkipHandler\n\n# Install this router', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot/db.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix profile router pass-through'
          git push