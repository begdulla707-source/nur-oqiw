name: Fix bot latency and test system

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!startsWith(github.event.head_commit.message, '[auto-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bot and test flows
        shell: python
        run: |
          from pathlib import Path

          p=Path('bot/main.py')
          s=p.read_text(encoding='utf-8')

          old='''    if st=="code":
        if text!=code_value():await m.answer("❌ Kod noto‘g‘ri. Qayta kiriting:");return
        update_user(m.from_user.id,code_ok=1,state="ready");await m.answer("🎉 Ro‘yxatdan o‘tish tugadi!\\n\\nTestga kirishingiz mumkin.",reply_markup=web_kb());return
    if st=="ready": await m.answer("Testga kirish:",reply_markup=web_kb());return
'''
          new='''    if st=="code":
        current_test=get_test(u["test_id"]) if u["test_id"] else None
        expected_code=current_test["code"] if current_test else code_value()
        if text.casefold()!=str(expected_code).casefold():await m.answer("❌ Kod noto‘g‘ri. Qayta kiriting:");return
        update_user(m.from_user.id,code_ok=1,state="ready");await m.answer("🎉 Ro‘yxatdan o‘tish tugadi!\\n\\nTestga kirishingiz mumkin.",reply_markup=user_menu());return
    if st=="ready": await m.answer("Testga kirish:",reply_markup=user_menu());return
'''
          if old not in s: raise SystemExit('main registration block not found')
          s=s.replace(old,new,1)

          old_web='''        data=await request.json()
        update=Update.model_validate(data)
        await dp.feed_update(bot,update)
        return {"ok":True}
    except Exception as e:
        logger.exception("Telegram webhook error: %s",e)
        return JSONResponse({"ok":False},status_code=500)
'''
          new_web='''        data=await request.json()
        update=Update.model_validate(data)
        async def process_update():
            try:
                await dp.feed_update(bot,update)
            except Exception as e:
                logger.exception("Telegram update processing error: %s",e)
        asyncio.create_task(process_update())
        return {"ok":True}
    except Exception as e:
        logger.exception("Telegram webhook parse error: %s",e)
        return JSONResponse({"ok":False},status_code=400)
'''
          if old_web not in s: raise SystemExit('webhook block not found')
          s=s.replace(old_web,new_web,1)

          old_mon='''    except Exception as e:
        if "not modified" not in str(e).lower():raise
    await q.answer()
'''
          new_mon='''    except Exception as e:
        if "not modified" not in str(e).lower():raise
    try: await q.answer()
    except Exception: pass
'''
          if old_mon in s: s=s.replace(old_mon,new_mon,1)

          p.write_text(s,encoding='utf-8')

          p=Path('bot/profile_features.py')
          s=p.read_text(encoding='utf-8')

          old='''    @r.message(CommandStart(deep_link=True))
    async def deep_start(m:Message,command):
        code=(command.args or "").strip();t=get_test_by_code(code)
        if not t:raise SkipHandler()
        u=ensure_user(m.from_user.id);update_user(m.from_user.id,test_id=t["test_id"],code_ok=1,state="ready",started_at=None,finished_at=None,score=0,grade="",answers_json="{}",submitted=0)
        await m.answer(f"{t['name']}\\n\\nTest kodi: {t['code']}\\n\\nTestga kirishingiz mumkin.",reply_markup=user_menu())
'''
          new='''    @r.message(CommandStart(deep_link=True))
    async def deep_start(m:Message,command):
        code=(command.args or "").strip();t=get_test_by_code(code)
        if not t:raise SkipHandler()
        u=ensure_user(m.from_user.id)
