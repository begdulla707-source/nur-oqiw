          if old not in s: raise SystemExit('deep start block not found')
          s=s.replace(old,new,1)

          old_admin='''    @r.callback_query(F.data.startswith("mt_q:"))
    async def mt_q(q:CallbackQuery):
'''
          new_admin='''    @r.callback_query(F.data.startswith("mt_key:"))
    async def mt_key(q:CallbackQuery):
        if q.from_user.id!=ADMIN:return
        tid=q.data.split(":",1)[1];set_setting("admin_test_id",tid);update_user(ADMIN,state=f"mt_key:{tid}")
