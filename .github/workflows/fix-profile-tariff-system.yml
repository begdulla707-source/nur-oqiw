name: Repair profile and tariff system

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bot
        shell: python
        run: |
          from pathlib import Path

          # Disable the experimental router injected into db.py. The real bot handlers
          # in main.py own the Telegram UI, which avoids handler-order conflicts.
          db = Path('bot/db.py')
          s = db.read_text(encoding='utf-8')
          marker = '\n# --- Persistent profile + Default/Premium Telegram UI ---'
          if marker in s:
              s = s.split(marker, 1)[0].rstrip() + '\n'
              db.write_text(s, encoding='utf-8')

          p = Path('bot/main.py')
          s = p.read_text(encoding='utf-8')

          # Add the single source of truth for the user keyboard and profile/tariff UI.
          marker = '@dp.message(Command("start"))'
          if 'def user_menu()' not in s:
              ui = r'''

def user_menu():
    return ReplyKeyboardMarkup(keyboard=[
        [KeyboardButton(text="Testni boshlash"), KeyboardButton(text="Profilim")],
        [KeyboardButton(text="Tariflar"), KeyboardButton(text="Userlar ro‘yxati")],
        [KeyboardButton(text="Mening natijam"), KeyboardButton(text="Yordam")]
    ], resize_keyboard=True, is_persistent=True)

def profile_kb():
    return InlineKeyboardMarkup(inline_keyboard=[
        [InlineKeyboardButton(text="Tariflar haqida", callback_data="profile_tariffs")],
        [InlineKeyboardButton(text="Userlar ro‘yxati", callback_data="profile_users")],
        [InlineKeyboardButton(text="Orqaga", callback_data="profile_back")]
    ])

def tariff_info_kb():
    return InlineKeyboardMarkup(inline_keyboard=[
        [InlineKeyboardButton(text="Default", callback_data="tariff_default_info")],
        [InlineKeyboardButton(text="Premium 💠", callback_data="tariff_premium_info")],
        [InlineKeyboardButton(text="Premium olish", callback_data="buy_premium")],
        [InlineKeyboardButton(text="Orqaga", callback_data="profile_back")]
    ])

def user_list_kb(tid):
    rows=[]
    for u in public_users()[:100]:
        mark="💠 " if str(u["tier"] or "default")=="premium" else ""
        name=(u["full_name"] or "Ismsiz")[:30]
        if is_premium(tid):
            rows.append([InlineKeyboardButton(text=f"{mark}{name}", url=f"tg://user?id={int(u['telegram_id'])}")])
        else:
            rows.append([InlineKeyboardButton(text=f"{mark}{name}", callback_data="premium_only")])
    rows.append([InlineKeyboardButton(text="Orqaga", callback_data="profile_back")])
    return InlineKeyboardMarkup(inline_keyboard=rows)

def profile_text(u):
    tier = "Premium 💠" if is_premium(u["telegram_id"]) else "Default"
    return ("PROFILIM\n\n"
            f"Ism-familiya: {u['full_name'] or '—'}\n"
            f"Telefon: {u['phone'] or '—'}\n"
            f"Telegram ID: {u['telegram_id']}\n"
            f"Tarif: {tier}\n\n"
            "Ma’lumotlaringiz Telegram ID bilan doimiy saqlanadi.")

def premium_stats_text(u):
    answers=json.loads(u["answers_json"] or "{}")
    total=len(active_questions())
    answered=len(answers)
    correct=0
    for q in active_questions():
        a=answers.get(str(q["id"]))
        if a is not None and normalize(a)==normalize(q["answer"]): correct+=1
    pct=(correct/answered*100) if answered else 0
    return ("PREMIUM 💠 — BATAFSIL STATISTIKA\n\n"
            f"Ishtirokchi: {u['full_name'] or '—'}\n"
            f"Jami savollar: {total}\nJavoblangan: {answered}\n"
            f"To‘g‘ri: {correct}\nXato: {max(0,answered-correct)}\n"
            f"Aniqlik: {pct:.1f}%\n\n"
            f"Yakuniy ball: {float(u['score'] or 0):.2f}\nBaho: {u['grade'] or '—'}")

def premium_menu_kb():
    return InlineKeyboardMarkup(inline_keyboard=[
        [InlineKeyboardButton(text="Batafsil statistika", callback_data="premium_stats")],
        [InlineKeyboardButton(text="Xato savollar", callback_data="premium_wrong")],
        [InlineKeyboardButton(text="Userlar ro‘yxati", callback_data="profile_users")],
        [InlineKeyboardButton(text="Orqaga", callback_data="profile_back")]
    ])

def admin_tariff_list_kb():
    users=all_registered_users()
    rows=[]
    for i,u in enumerate(users,1):
        mark="💠" if is_premium(u["telegram_id"]) else ""
        rows.append([InlineKeyboardButton(text=f"{i}. {mark}{(u['full_name'] or 'Ismsiz')[:22]} — {u['telegram_id']}", callback_data=f"adm_tariff_{u['telegram_id']}")])
    rows.append([InlineKeyboardButton(text="Orqaga", callback_data="admin_home")])
    return InlineKeyboardMarkup(inline_keyboard=rows)

def admin_tariff_user_kb(uid):
    return InlineKeyboardMarkup(inline_keyboard=[
        [InlineKeyboardButton(text="Premium 💠 berish", callback_data=f"adm_tariff_set_premium_{uid}")],
        [InlineKeyboardButton(text="Default qilish", callback_data=f"adm_tariff_set_default_{uid}")],
        [InlineKeyboardButton(text="Orqaga", callback_data="admin_tariff_list")]
    ])
