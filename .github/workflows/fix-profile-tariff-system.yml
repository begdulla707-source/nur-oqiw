@dp.callback_query(F.data=="profile_back")
async def profile_back(q:CallbackQuery):
    u=get_user(q.from_user.id)
    if not u or not u["code_ok"]: await q.answer("Avval ro‘yxatdan o‘ting.",show_alert=True); return
    await q.message.edit_text(profile_text(u),reply_markup=profile_kb()); await q.answer()

@dp.callback_query(F.data=="profile_tariffs")
async def profile_tariffs(q:CallbackQuery):
    await q.message.edit_text("TARIFLAR HAQIDA\\n\\nDEFAULT\\n• Oddiy user imkoniyatlari\\n• 💠 nishon yo‘q\\n• Boshqa userga Telegram orqali yozish yopiq\\n\\nPREMIUM 💠\\n• Batafsil shaxsiy statistika\\n• Xato savollarni ko‘rish\\n• Userlar ro‘yxatidan Telegram profiliga yozish\\n• 💠 Premium nishon\\n\\nPremium tarifni admin beradi.",reply_markup=tariff_info_kb()); await q.answer()

@dp.callback_query(F.data=="profile_users")
async def profile_users(q:CallbackQuery):
    await q.message.edit_text("USERLAR RO‘YXATI\\n\\n💠 — Premium",reply_markup=user_list_kb(q.from_user.id)); await q.answer()

@dp.callback_query(F.data=="premium_only")
async def premium_only(q:CallbackQuery):
    await q.answer("Bu funksiya Premium 💠 tarif uchun.",show_alert=True)

@dp.callback_query(F.data=="tariff_default_info")
async def tariff_default_info(q:CallbackQuery):
    await q.answer("Default — oddiy tarif.",show_alert=True)

@dp.callback_query(F.data=="tariff_premium_info")
async def tariff_premium_info(q:CallbackQuery):
    await q.answer("Premium 💠 admin orqali beriladi.",show_alert=True)

@dp.callback_query(F.data=="buy_premium")
async def buy_premium(q:CallbackQuery):
    await q.message.answer("Premium 💠 olish uchun admin bilan bog‘laning.",reply_markup=InlineKeyboardMarkup(inline_keyboard=[[InlineKeyboardButton(text="Admin bilan bog‘lanish",url=f"tg://user?id={ADMIN}")]])); await q.answer()

@dp.callback_query(F.data=="premium_stats")
async def premium_stats(q:CallbackQuery):
    if not is_premium(q.from_user.id): await q.answer("Premium 💠 kerak.",show_alert=True); return
    u=get_user(q.from_user.id); await q.message.edit_text(premium_stats_text(u),reply_markup=premium_menu_kb()); await q.answer()

@dp.callback_query(F.data=="premium_wrong")
async def premium_wrong(q:CallbackQuery):
    if not is_premium(q.from_user.id): await q.answer("Premium 💠 kerak.",show_alert=True); return
    u=get_user(q.from_user.id); answers=json.loads(u["answers_json"] or "{}"); lines=["XATO SAVOLLAR",""]
    for item in active_questions():
        a=answers.get(str(item["id"]))
        if a is not None and normalize(a)!=normalize(item["answer"]): lines.append(f"{item['id']}. {item['question']}\\nSiz: {a}\\nTo‘g‘ri: {item['answer']}\\n")
    await q.message.edit_text("\\n".join(lines)[:3900] if len(lines)>2 else "Hozircha xato javob yo‘q.",reply_markup=premium_menu_kb()); await q.answer()

@dp.callback_query(F.data=="admin_tariff_list")
async def admin_tariff_list(q:CallbackQuery):
