plugins { id 'fabric-loom' version '1.8.13' }
version = '1.1.0'
group = 'uz.nuroqiw'
base { archivesName = 'NurChat-1.21.1' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.7+1.21.1'
    include 'net.fabricmc.fabric-api:fabric-api:0.116.7+1.21.1'
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
jar { from('LICENSE') }
// A private one-installation invitation is supplied only for the delivered jar.
def enrollmentFile = providers.environmentVariable('NUR_CHAT_ENROLLMENT_FILE')
processResources {
    if (enrollmentFile.isPresent()) from(enrollmentFile.get()) { rename { 'nurchat-enrollment.json' } }
}
