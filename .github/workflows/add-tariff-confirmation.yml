name: Add tariff confirmation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch tariff confirmation
        shell: python
        run: |
          from pathlib import Path
          p = Path('bot/db.py')
          s = p.read_text(encoding='utf-8')
          start = s.find('    if tid==ADMIN_ID and (d.startswith("tariff_grant_") or d.startswith("tariff_default_")):')
          end = s.find('    if tid==ADMIN_ID and d=="admin_tariff_list":', start)
          if start == -1 or end == -1:
              raise SystemExit('tariff block not found')
          block = '''    if tid==ADMIN_ID and (d.startswith("tariff_grant_") or d.startswith("tariff_default_")):
        uid=int(d.rsplit("_",1)[1]); target=get_user(uid)
        if not target: await query.answer("User topilmadi",show_alert=True); return
        tier="premium" if d.startswith("tariff_grant_") else "default"
        label="Premium 💠" if tier=="premium" else "Default"
        kb=_InlineKeyboardMarkup(inline_keyboard=[
            [_InlineKeyboardButton(text="TASDIQLASH",callback_data=f"tariff_confirm_{tier}_{uid}")],
            [_InlineKeyboardButton(text="Bekor qilish",callback_data="admin_tariff_list")]
        ])
        await query.message.edit_text(f"TARIF BERISHNI TASDIQLASH\\n\\n👤 {target['full_name'] or 'Ismsiz'}\\n🆔 {uid}\\n\\nYangi tarif: {label}\\n\\nHaqiqatan shu tarifni berasizmi?",reply_markup=kb); await query.answer(); return
    if tid==ADMIN_ID and d.startswith("tariff_confirm_"):
        parts=d.split("_")
        if len(parts)<4: await query.answer("Xato",show_alert=True); return
        tier=parts[2]; uid=int(parts[3]); target=get_user(uid)
        if not target: await query.answer("User topilmadi",show_alert=True); return
        set_tier(uid,tier,ADMIN_ID)
        label="Premium 💠" if tier=="premium" else "Default"
        await query.message.edit_text(f"TARIF YANGILANDI\\n\\n👤 {target['full_name'] or 'Ismsiz'}\\n🆔 {uid}\\n\\nTarif: {label}\\n\\nTasdiqlandi.",reply_markup=_InlineKeyboardMarkup(inline_keyboard=[[_InlineKeyboardButton(text="Tariflar ro‘yxati",callback_data="admin_tariff_list")],[ _InlineKeyboardButton(text="Admin panel",callback_data="admin_tariff_back")]])); await query.answer("Tarif saqlandi")
        try: await bot.send_message(uid,f"Tarifingiz yangilandi: {label}.")
        except Exception: pass
        return
'''
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot/db.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Require tariff assignment confirmation'
          git push