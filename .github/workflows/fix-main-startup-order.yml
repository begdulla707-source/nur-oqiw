name: Fix cleanup loop startup order

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move main invocation below cleanup_loop definition
        shell: python
        run: |
          from pathlib import Path
          p = Path('bot/main.py')
          s = p.read_text(encoding='utf-8')
          marker = 'if __name__=="__main__":asyncio.run(main())\nasync def cleanup_loop():'
          if marker not in s:
              raise SystemExit('expected startup marker not found')
          s = s.replace(marker, 'async def cleanup_loop():', 1)
          s = s.rstrip() + '\n\nif __name__=="__main__":asyncio.run(main())\n'
          p.write_text(s, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot/main.py
          git commit -m 'Fix cleanup loop startup order' || exit 0
          git push