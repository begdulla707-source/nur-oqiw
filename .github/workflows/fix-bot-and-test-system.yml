        if not u["full_name"] or not u["phone"]:
            update_user(m.from_user.id,state="name")
            await m.answer(f"{t['name']}\\n\\nRo‘yxatdan o‘tish uchun ism va familiyangizni kiriting:")
            return
        update_user(m.from_user.id,state="code")
        await m.answer(f"{t['name']}\\n\\nTest kodi: {t['code']}\\n\\nKirish kodini kiriting:")
